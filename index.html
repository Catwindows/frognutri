<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>🐸 FrogNutri - Bột Dinh Dưỡng Ếch</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6fff8;
  --card: #ffffffcc;
  --sidebar1: #a5d6a7;
  --sidebar2: #81c784;
  --primary: #4CAF50;
  --text: #222;
  --shadow: 0 15px 40px rgba(0,0,0,.08);
}
body.dark {
  --bg: #0f1a13;
  --card: #1e2b24cc;
  --sidebar1: #1e3a2d;
  --sidebar2: #244a38;
  --primary: #66bb6a;
  --text: #eee;
}
* { margin:0; padding:0; box-sizing:border-box; font-family:Poppins,sans-serif; transition:.25s; }
body { display:flex; flex-direction:row; min-height:100vh; background:var(--bg); color:var(--text); }

/* SIDEBAR */
.sidebar { width:240px; background:linear-gradient(180deg,var(--sidebar1),var(--sidebar2)); padding:25px; display:flex; flex-direction:column; color:white; position:fixed; height:100vh; left:0; top:0; z-index:100; overflow-y:auto; }
.logo { font-size:22px; font-weight:600; margin-bottom:30px; }
.sidebar-top { display:none; }
.hamburger { display:none; }
.sidebar-nav { display:flex; flex-direction:column; max-height:none; overflow:visible; }
.sidebar a { text-decoration:none; color:white; padding:12px 14px; border-radius:12px; margin-bottom:8px; display:flex; gap:10px; align-items:center; cursor:pointer; }
.sidebar a:hover { background:rgba(255,255,255,.25); transform:translateX(6px); }
.sidebar a.active { background:white; color:var(--primary); font-weight:600; }
.logout { margin-top:auto; background:#e53935; }
.logout:hover { background:#c62828; }

/* MAIN */
main { flex:1; margin-left:260px; padding:35px; overflow:auto; animation:fade .6s ease; width:calc(100% - 260px); }
@keyframes fade { from{opacity:0;transform:translateY(15px)} to{opacity:1} }
.page { display:none; }
.page.active { display:block; }

/* TOPBAR */
.topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; }
.topbar h2 { font-size:28px; font-weight:600; }
.toggle-theme { cursor:pointer; padding:9px 15px; border-radius:12px; background:var(--primary); color:white; border:none; font-size:14px; }

/* GRID & CARD */
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:25px; }
.card { background:var(--card); backdrop-filter:blur(18px); padding:25px; border-radius:20px; box-shadow:var(--shadow); transform:translateY(0); }
.card:hover { transform:translateY(-8px) scale(1.02); box-shadow:0 25px 55px rgba(0,0,0,.15); }
.icon { font-size:38px; margin-bottom:12px; color:var(--primary); }
.card h3 { font-size:18px; margin-bottom:10px; }
.card p { font-size:14px; line-height:1.6; }

/* FORMS */
form { display:flex; flex-direction:column; gap:15px; max-width:600px; }
input, textarea, select { width:100%; padding:12px; border:1px solid #ccc; border-radius:8px; background:var(--card); color:var(--text); font-size:14px; }
input:focus, textarea:focus, select:focus { outline:none; border-color:var(--primary); box-shadow:0 0 12px var(--primary)55; }
button, .btn { padding:12px 20px; border:none; border-radius:8px; background:var(--primary); color:white; cursor:pointer; font-size:14px; font-weight:600; transition:0.3s; }
button:hover, .btn:hover { filter:brightness(1.1); }

/* PROFILE */
.profile-wrap { display:flex; gap:40px; align-items:flex-start; }
.avatar { width:170px; height:170px; border-radius:50%; object-fit:cover; border:6px solid var(--primary); box-shadow:0 10px 30px rgba(0,0,0,.15); }

/* CHAT */
.chat-wrap { display:flex; justify-content:center; height:500px; }
.chat-box { width:100%; max-width:900px; background:var(--card); backdrop-filter:blur(15px); border-radius:22px; box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden; }
.messages { flex:1; padding:20px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
.msg { padding:12px 16px; border-radius:18px; max-width:70%; animation:fade .25s ease; }
.msg.user { background:var(--primary); color:white; align-self:flex-end; }
.msg.bot { background:#e8f5e9; align-self:flex-start; }
body.dark .msg.bot { background:#2a3b31; }
.input-area { display:flex; gap:10px; padding:15px; }
.input-area input { flex:1; margin:0; }
.input-area button { flex-shrink:0; margin:0; }
.typing { font-size:13px; opacity:.6; padding-left:20px; padding-bottom:10px; }
.chat-hint { margin:0 15px 10px; color:#475569; font-size:13px; line-height:1.5; }
